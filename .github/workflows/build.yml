name: Build AxManager

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        type: choice
        options:
          - Debug
          - Release
        default: Debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865 cmake;3.22.1"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :manager:assemble${{ inputs.build_type }} --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AxManager-${{ inputs.build_type }}
          path: manager/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
